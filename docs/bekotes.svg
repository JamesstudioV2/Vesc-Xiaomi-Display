<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="960" height="570" fill="#ffffff"/>
  <defs>
    <g id="gnd">
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#212121" stroke-width="2"/>
      <line x1="-8" y1="5" x2="8" y2="5" stroke="#212121" stroke-width="2"/>
      <line x1="-4" y1="10" x2="4" y2="10" stroke="#212121" stroke-width="2"/>
    </g>
    <g id="lamp">
      <circle cx="0" cy="0" r="14" fill="#fffde7" stroke="#212121" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#212121" stroke-width="2"/>
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="#212121" stroke-width="2"/>
    </g>
  </defs>

  <!-- Kijelző -->
  <rect x="30" y="60" width="170" height="200" rx="10" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
  <text x="115" y="88" text-anchor="middle" font-weight="bold">PRO 2 kijelző</text>
  <text x="60" y="105" fill="#c62828">piros</text>
  <text x="60" y="145" fill="#212121">fekete</text>
  <text x="60" y="185" fill="#8d6e00">sárga (adat)</text>
  <text x="60" y="225" fill="#2e7d32">zöld (gomb)</text>

  <!-- Hátsó VESC COMM -->
  <rect x="330" y="40" width="190" height="300" rx="10" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
  <text x="425" y="65" text-anchor="middle" font-weight="bold">Hátsó VESC</text>
  <text x="425" y="83" text-anchor="middle">COMM port</text>
  <text x="340" y="105">5V</text>
  <text x="340" y="145">GND</text>
  <text x="340" y="185">TX</text>
  <text x="340" y="225">RX</text>
  <text x="340" y="265">3.3V</text>
  <text x="340" y="305" fill="#757575" font-size="12">ADC1: szabad</text>
  <text x="340" y="321" fill="#757575" font-size="12">(10 kΩ → GND)</text>
  <text x="510" y="125" text-anchor="end">ADC2</text>

  <!-- vezetékek kijelző -> COMM -->
  <line x1="200" y1="100" x2="330" y2="100" stroke="#c62828" stroke-width="3"/>
  <line x1="200" y1="140" x2="330" y2="140" stroke="#212121" stroke-width="3"/>
  <line x1="200" y1="180" x2="330" y2="180" stroke="#b8860b" stroke-width="3"/>
  <line x1="200" y1="220" x2="330" y2="220" stroke="#2e7d32" stroke-width="3"/>
  <text x="265" y="172" text-anchor="middle" font-size="12" fill="#616161">half-duplex</text>

  <!-- felhúzó ellenállás RX - 3.3V -->
  <circle cx="290" cy="220" r="4" fill="#212121"/>
  <line x1="290" y1="220" x2="290" y2="228" stroke="#212121" stroke-width="2"/>
  <polyline points="290,228 282,231 298,237 282,243 298,249 290,252" fill="none" stroke="#212121" stroke-width="2"/>
  <line x1="290" y1="252" x2="290" y2="260" stroke="#212121" stroke-width="2"/>
  <line x1="290" y1="260" x2="330" y2="260" stroke="#212121" stroke-width="2"/>
  <text x="282" y="290" text-anchor="end" font-size="12">470 Ω</text>
  <text x="282" y="305" text-anchor="end" font-size="12">felhúzó</text>

  <!-- első lámpa fokozat -->
  <line x1="520" y1="120" x2="650" y2="120" stroke="#1565c0" stroke-width="3"/>
  <circle cx="600" cy="120" r="4" fill="#212121"/>
  <line x1="600" y1="120" x2="600" y2="138" stroke="#212121" stroke-width="2"/>
  <polyline points="600,138 592,141 608,147 592,153 608,159 600,162" fill="none" stroke="#212121" stroke-width="2"/>
  <line x1="600" y1="162" x2="600" y2="172" stroke="#212121" stroke-width="2"/>
  <use href="#gnd" x="600" y="172"/>
  <text x="590" y="205" text-anchor="end" font-size="12">10–100 kΩ</text>
  <rect x="650" y="95" width="100" height="50" rx="6" fill="#e3f2fd" stroke="#424242" stroke-width="2"/>
  <text x="700" y="117" text-anchor="middle" font-weight="bold">N-FET</text>
  <text x="700" y="135" text-anchor="middle" font-size="11">logikai szintű</text>
  <text x="656" y="112" font-size="11">G</text>
  <line x1="700" y1="95" x2="700" y2="59" stroke="#212121" stroke-width="2"/>
  <use href="#lamp" x="700" y="45"/>
  <line x1="700" y1="31" x2="700" y2="16" stroke="#212121" stroke-width="2"/>
  <text x="710" y="20" font-size="12">+ lámpa táp</text>
  <text x="722" y="50" font-weight="bold">Első lámpa</text>
  <line x1="700" y1="145" x2="700" y2="165" stroke="#212121" stroke-width="2"/>
  <use href="#gnd" x="700" y="165"/>

  <!-- PPM port + féklámpa fokozat -->
  <rect x="330" y="380" width="190" height="80" rx="10" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
  <text x="425" y="405" text-anchor="middle" font-weight="bold">PPM (servo) port</text>
  <text x="510" y="430" text-anchor="end">jel</text>
  <text x="340" y="450" fill="#757575" font-size="12">GND közös</text>
  <line x1="520" y1="425" x2="650" y2="425" stroke="#c62828" stroke-width="3"/>
  <circle cx="600" cy="425" r="4" fill="#212121"/>
  <line x1="600" y1="425" x2="600" y2="443" stroke="#212121" stroke-width="2"/>
  <polyline points="600,443 592,446 608,452 592,458 608,464 600,467" fill="none" stroke="#212121" stroke-width="2"/>
  <line x1="600" y1="467" x2="600" y2="477" stroke="#212121" stroke-width="2"/>
  <use href="#gnd" x="600" y="477"/>
  <text x="590" y="505" text-anchor="end" font-size="12">10–100 kΩ</text>
  <rect x="650" y="400" width="100" height="50" rx="6" fill="#ffebee" stroke="#424242" stroke-width="2"/>
  <text x="700" y="422" text-anchor="middle" font-weight="bold">N-FET</text>
  <text x="700" y="440" text-anchor="middle" font-size="11">logikai szintű</text>
  <text x="656" y="417" font-size="11">G</text>
  <line x1="700" y1="400" x2="700" y2="364" stroke="#212121" stroke-width="2"/>
  <use href="#lamp" x="700" y="350"/>
  <line x1="700" y1="336" x2="700" y2="321" stroke="#212121" stroke-width="2"/>
  <text x="710" y="325" font-size="12">+ lámpa táp</text>
  <text x="722" y="355" font-weight="bold">Féklámpa</text>
  <line x1="700" y1="450" x2="700" y2="470" stroke="#212121" stroke-width="2"/>
  <use href="#gnd" x="700" y="470"/>

  <!-- CAN -->
  <rect x="330" y="495" width="190" height="55" rx="10" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
  <text x="425" y="518" text-anchor="middle" font-weight="bold">CAN port</text>
  <text x="425" y="538" text-anchor="middle" font-size="12">CAN-H, CAN-L, GND</text>
  <line x1="520" y1="522" x2="790" y2="522" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="790" y="495" width="150" height="55" rx="10" fill="#f3e5f5" stroke="#424242" stroke-width="2"/>
  <text x="865" y="518" text-anchor="middle" font-weight="bold">Első VESC</text>
  <text x="865" y="538" text-anchor="middle" font-size="12">elso_vezerlo.lisp</text>

  <text x="30" y="350" font-size="12" fill="#424242">Gomb (a kijelzőben): lenyomva</text>
  <text x="30" y="366" font-size="12" fill="#424242">GND-re húzza a zöld vezetéket.</text>
  <text x="30" y="395" font-size="12" fill="#424242">Kimenetek: 3,3 V logika,</text>
  <text x="30" y="411" font-size="12" fill="#424242">logikai szintű N-FET kell.</text>
</svg>
